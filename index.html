<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Privacy Policies - VuzykDev</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <p class="app">VuzykDev</p>
  <h1>Privacy Policies</h1>
</header>

<p id="notice" class="notice" hidden></p>
<p>Choose an app to read its privacy policy.</p>

<ul id="apps" class="apps"></ul>

<noscript>
  <ul class="apps">
    <li>
      <img class="icon" src="lines98/icon.svg" alt="" width="52" height="52">
      <div class="info">
        <span class="name">Lines 98: Pure Balls Puzzle</span>
        <span class="desc">Balls puzzle game</span>
        <span class="links"><a class="btn primary" href="lines98/">Privacy policy</a><a class="btn" href="lines98/licenses/">Licenses</a></span>
      </div>
    </li>
  </ul>
</noscript>

<footer>VuzykDev &middot; <a href="mailto:VuzykDev@proton.me">VuzykDev@proton.me</a></footer>

<script>
// To add an app: add an entry here and put its policy in <slug>/index.html.
// Set licenses: true when <slug>/licenses/index.html exists.
// Put the app icon in <slug>/icon.svg and set icon: true; otherwise the first letter is shown.
var APPS = [
  { slug: "lines98", name: "Lines 98: Pure Balls Puzzle", desc: "Balls puzzle game", icon: true, licenses: true }
];

// Direct links: ?app=lines98 or #lines98 open that app's policy.
var params = new URLSearchParams(location.search);
var wanted = (params.get("app") || location.hash.replace(/^#\/?/, "")).toLowerCase();

function findApp(slug) {
  for (var i = 0; i < APPS.length; i++) {
    if (APPS[i].slug === slug) return APPS[i];
  }
  return null;
}

if (wanted) {
  var app = findApp(wanted);
  if (app) {
    location.replace(app.slug + "/");
  } else {
    var notice = document.getElementById("notice");
    notice.textContent = "No privacy policy found for \"" + wanted + "\". Pick one from the list.";
    notice.hidden = false;
  }
}

function el(tag, cls, text) {
  var e = document.createElement(tag);
  e.className = cls;
  if (text) e.textContent = text;
  return e;
}

function link(cls, href, text) {
  var a = el("a", cls, text);
  a.href = href;
  return a;
}

var list = document.getElementById("apps");
APPS.forEach(function (app) {
  var li = document.createElement("li");
  var icon;
  if (app.icon) {
    icon = el("img", "icon");
    icon.src = app.slug + "/icon.svg";
    icon.alt = "";
    icon.width = icon.height = 52;
  } else {
    icon = el("span", "icon", app.name.charAt(0));
    icon.setAttribute("aria-hidden", "true");
  }
  var info = el("div", "info");
  info.appendChild(el("span", "name", app.name));
  info.appendChild(el("span", "desc", app.desc));
  var links = el("span", "links");
  links.appendChild(link("btn primary", app.slug + "/", "Privacy policy"));
  if (app.licenses) links.appendChild(link("btn", app.slug + "/licenses/", "Licenses"));
  info.appendChild(links);
  li.appendChild(icon);
  li.appendChild(info);
  list.appendChild(li);
});
</script>

</body>
</html>
